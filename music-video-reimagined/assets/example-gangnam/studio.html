<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawdnam studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="227.5" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<!-- this video's shared code -->
<script src="src/song.js"></script>
<script src="src/fx.js"></script>
<script src="src/dance.js"></script>
<script src="src/cast.js"></script>
<script src="src/sets.js"></script>
<script src="src/counter.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<script src="src/sheets_gs.js"></script>
<!-- the video: one file per chapter, in order -->
<script src="src/ch/c01_intro.js"></script>
<script src="src/ch/c02_stable.js"></script>
<script src="src/ch/c03_storm.js"></script>
<script src="src/ch/c04_explosion.js"></script>
<script src="src/ch/c05_arena.js"></script>
<script src="src/ch/c06_montage.js"></script>
<script src="src/ch/c07_garage.js"></script>
<script src="src/ch/c08_elevator.js"></script>
<script src="src/ch/c09_billion.js"></script>
<script src="src/ch/c10_platform.js"></script>
<script src="src/ch/c11_global.js"></script>
<script src="src/ch/c12_overflow.js"></script>
<script src="src/ch/c13_party.js"></script>
<script src="src/ch/c14_ending.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
